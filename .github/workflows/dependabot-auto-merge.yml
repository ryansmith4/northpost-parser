name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Runs only for a pull request that Dependabot opened from a branch in this
    # repository and whose latest event Dependabot raised. The author and repository
    # checks stop a fork from getting its own Dependabot to raise the event on a pull
    # request against this repository.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sorts the bump for the generated release notes (.github/release.yml):
      # runtime-dependency for libraries shipped in the artifact, tooling for the rest.
      # The patterns match the runtime-security group in .github/dependabot.yml.
      - name: Label as runtime or tooling dependency
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$DEPENDENCIES" in
            *org.antlr*|*org.slf4j*) label=runtime-dependency ;;
            *) label=tooling ;;
          esac
          echo "Dependencies: $DEPENDENCIES -> $label"
          gh pr edit "$PR_URL" --add-label "$label"

      # The merge is made as a GitHub App rather than with GITHUB_TOKEN. GitHub starts no
      # workflow for a push made with GITHUB_TOKEN, so a merge made that way never ran CI
      # on main: main got no dependency snapshot for the next pull request to be compared
      # against, and the auto-release job in ci.yml could never fire.
      #
      # The app is installed on this repository only, with Contents and Pull requests
      # set to read and write. Its client ID and private key are stored as
      # Dependabot secrets, because a workflow started by a Dependabot pull request
      # cannot read Actions secrets. The token expires within the hour and is revoked
      # when the job ends.
      - name: Create a token for the auto-merge app
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # Auto-merge waits for the required status checks configured in the main branch
      # ruleset before merging.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
