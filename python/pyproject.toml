[project]
name = "northpost-parser"
version = "1.1.0"
description = "Canadian postal address parser built with ANTLR4"
authors = [{name = "Ryan Smith"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["antlr4-python3-runtime==4.13.2"]

[tool.poetry]
packages = [{include = "northpost_parser", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
