plugins {
    id 'java-library'
    id 'antlr'
    id 'idea'
    id 'eclipse'
    alias libs.plugins.spotless
    alias libs.plugins.qodana
    alias libs.plugins.maven.publish
    alias libs.plugins.axion.release
}

scmVersion {
    tag {
        initialVersion { config, position -> '1.0.0' }
    }
}

group = 'com.guidedbyte'
version = scmVersion.version
description = 'Canadian postal address parser library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ANTLR
    antlr libs.antlr
    api libs.antlr.runtime

    // Logging (API only — consumers provide the implementation)
    api libs.slf4j.api

    // Test
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testRuntimeOnly libs.logback.classic
}

// Libraries that reach consumers through this library are handled differently from build
// and test tooling: Dependabot's ordinary updates to them wait for a manual merge, and its
// security updates to them trigger a patch release. The automation recognises them by the
// start of their group name, listed here and in three other places:
//
//   .github/workflows/dependabot-auto-merge.yml  ("Label as runtime or tooling dependency")
//   .github/dependabot.yml                       (the runtime-security group)
//   .github/workflows/ci.yml                     (the auto-release job's version catalog check)
//
// The check below fails the build when a runtime dependency is declared whose group is not
// listed, so a new one cannot be added without the automation being told about it.
def monitoredRuntimeGroups = ['org.antlr', 'org.slf4j']

tasks.register('checkRuntimeDependencies') {
    group = 'verification'
    description = 'Fails if a runtime dependency is not in the list the Dependabot automation monitors.'
    def unmonitored = configurations.runtimeClasspath.allDependencies
        .findAll { dep -> !monitoredRuntimeGroups.any { (dep.group ?: '').startsWith(it) } }
        .collect { dep -> "${dep.group}:${dep.name}".toString() }
    doLast {
        if (!unmonitored.isEmpty()) {
            throw new GradleException(
                "Runtime dependencies the Dependabot automation does not monitor: ${unmonitored.join(', ')}.\n" +
                "Consumers receive these through this library. Add the group to monitoredRuntimeGroups in " +
                "build.gradle and to the three files listed in the comment above it."
            )
        }
    }
}
check.dependsOn 'checkRuntimeDependencies'

// ANTLR configuration
generateGrammarSource {
    maxHeapSize = "64m"
    arguments += ["-visitor", "-long-messages"]
    packageName = "com.guidedbyte.address.parser"
    outputDirectory = layout.buildDirectory.dir("generated-src/antlr/main/com/guidedbyte/address/parser").get().asFile
}

compileJava.dependsOn generateGrammarSource
tasks.configureEach { task ->
    if (task.name == 'sourcesJar') {
        task.dependsOn generateGrammarSource
    }
}

sourceSets {
    main {
        java {
            srcDirs += layout.buildDirectory.dir("generated-src/antlr/main").get().asFile
        }
    }
}

if (plugins.hasPlugin('idea')) {
    idea {
        module {
            generatedSourceDirs += layout.buildDirectory.dir("generated-src/antlr/main").get().asFile
        }
    }
}

if (plugins.hasPlugin('eclipse')) {
    eclipse {
        classpath {
            file {
                beforeMerged { classpath ->
                    classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder("build/generated-src/antlr/main", null))
                }
            }
        }
    }
}

test {
    useJUnitPlatform {
        def bulkTags = []
        if (!project.hasProperty('odaBulk')) {
            excludeTags 'oda-bulk'
        } else if (project.hasProperty('odaBulkOnly')) {
            bulkTags << 'oda-bulk'
        }
        if (!project.hasProperty('narBulk')) {
            excludeTags 'nar-bulk'
        } else if (project.hasProperty('narBulkOnly')) {
            bulkTags << 'nar-bulk'
        }
        if (!bulkTags.isEmpty()) {
            includeTags(*bulkTags)
        }
    }
    if (project.hasProperty('odaBulk')) {
        systemProperty 'oda.provinces', project.findProperty('odaProvinces') ?: ''
    }
    if (project.hasProperty('narBulk')) {
        systemProperty 'nar.provinces', project.findProperty('narProvinces') ?: ''
    }
}

compileJava {
    options.release = 21
}

// NAR regression sample (src/test/resources/nar_sample_addresses.csv) — see NarSampleGenerator
tasks.register('refreshNarSample', JavaExec) {
    group = 'verification'
    description = 'Re-records the expected parser output for the addresses already in the NAR regression sample (no NAR data needed).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.guidedbyte.address.NarSampleGenerator'
    args 'refresh'
}

tasks.register('drawNarSample', JavaExec) {
    group = 'verification'
    description = 'Redraws the NAR regression sample from nar-data/NAR_*.zip (deterministic; takes a few minutes).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.guidedbyte.address.NarSampleGenerator'
    args 'draw'
    maxHeapSize = '1g'
}

compileTestJava {
    options.release = 21
}

// Maven Central publishing
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'NorthPost Parser'
        description = 'Canadian postal address parser library built with ANTLR4'
        inceptionYear = '2025'
        url = 'https://github.com/ryansmith4/northpost-parser/'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'ryansmith4'
                name = 'Ryan Smith'
                url = 'https://github.com/ryansmith4/'
            }
        }

        scm {
            url = 'https://github.com/ryansmith4/northpost-parser/'
            connection = 'scm:git:git://github.com/ryansmith4/northpost-parser.git'
            developerConnection = 'scm:git:ssh://git@github.com/ryansmith4/northpost-parser.git'
        }
    }
}

// Spotless code formatting
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get()).formatJavadoc(true)
        removeUnusedImports()
    }
}

// Qodana configuration
qodana {
    projectPath.set(projectDir.path)
    resultsPath.set(layout.buildDirectory.dir("qodana/results").get().asFile.path)
    cachePath.set(layout.buildDirectory.dir("qodana/cache").get().asFile.path)
}

tasks.named("qodanaScan") {
    (it as org.jetbrains.qodana.tasks.QodanaScanTask).arguments.set(
        [
            "--linter", "qodana-jvm-community",
            "--within-docker=false",
        ],
    )
}
