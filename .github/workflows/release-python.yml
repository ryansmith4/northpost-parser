name: Release Python package to PyPI

on:
  release:
    types: [ published ]
  # Manual re-run at a vX.Y.Z tag ref (github.ref_name is then the tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify ref is a release tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) echo "Releasing $GITHUB_REF_NAME" ;;
            *) echo "::error::Expected a vX.Y.Z tag ref, got '$GITHUB_REF_NAME'"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Java for ANTLR generation
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Install Poetry and project
        run: |
          python -m pip install poetry==2.3.4
          poetry install --no-interaction

      # The package version is derived from the release tag, matching the Java release.
      - name: Set version from tag
        run: poetry version "${GITHUB_REF_NAME#v}"

      - name: Regenerate, test, and build
        run: |
          poetry check --lock
          poetry run python scripts/generate_parser.py
          poetry run pytest
          poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    # Trusted publishing: no API token is stored. Configure a "pypi" environment in
    # the repository and a matching trusted publisher on PyPI (see python/README.md).
    environment:
      name: pypi
      url: https://pypi.org/project/northpost-parser/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Automated releases are triggered by a bot, so Actions failures are not emailed
  # to anyone. Open an issue so a failed publish is not missed.
  report-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [ build, publish ]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      issues: write

    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "An automated release workflow failed"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Python release $GITHUB_REF_NAME failed" \
            --label release-failure \
            --body "$(cat <<BODY
          The Python release workflow for \`$GITHUB_REF_NAME\` did not complete.

          | Job | Result |
          |---|---|
          | build | $BUILD_RESULT |
          | publish | $PUBLISH_RESULT |

          Run: $RUN_URL

          If \`publish\` failed, check whether the version reached PyPI before re-running:
          https://pypi.org/project/northpost-parser/#history

          To retry: \`gh workflow run release-python.yml --ref $GITHUB_REF_NAME\`
          BODY
          )"
