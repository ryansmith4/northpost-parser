# Groups the release notes that GitHub generates (the "Generate release notes" button, or
# `gh release create --generate-notes` in the CI auto-release job) by pull-request label.
# A pull request lands in the first category whose label it carries. Unlabelled pull
# requests fall into "Other Changes", so label a PR before merging if it belongs elsewhere.
#
# Not the release workflow: that is .github/workflows/release.yml.
changelog:
  exclude:
    labels:
      # The automated README version bump that follows each release.
      - skip-changelog
      # Test and build tooling bumps change nothing in the artifact. The Dependabot
      # auto-merge workflow applies this label; the Full Changelog link still lists them.
      - tooling
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      # Parse-output changes are what the README's Versioning section promises to list,
      # so accuracy work is listed here unless it is also labelled as a feature.
      labels:
        - bug
        - accuracy
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      # Libraries shipped in the artifact (ANTLR runtime, SLF4J API). The plain
      # "dependencies" label is a fallback for a bump the auto-merge workflow did not sort.
      labels:
        - runtime-dependency
        - dependencies
    - title: Maintenance
      labels:
        - ci
        - refactor
    - title: Other Changes
      labels:
        - "*"
