name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets release.yml run CI on the automated README-update branch: events raised
  # with GITHUB_TOKEN (such as that branch's push) do not start workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps one run per branch and cancels the older one. Each push to main
# gets a group of its own, so its run is never dropped. In a shared group only one run
# can wait, and a newer one replaces it. Dependabot merges land seconds apart, so the
# runs in the middle, and their release-reminder jobs, would be lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      matrix:
        java: [ 21, 25 ]

    # These job names are required status checks in the main branch ruleset.
    name: Java ${{ matrix.java }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew build

  dependency-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  # Fails a PR that adds or upgrades to a dependency with a known advisory, so it is
  # flagged before merging. It blocks the merge only once this job is a required check.
  # The action compares this PR's dependency snapshot against main's, so the PR snapshot
  # is submitted first.
  #
  # Skipped for pull requests from forks: GitHub gives those a read-only token, so the
  # snapshot cannot be submitted and the job would always fail. A skipped job counts as
  # passing if this is made a required check; dependency changes in a fork pull request
  # are reviewed by hand. Dependabot's pull requests come from this repository, so they
  # are still checked.
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true

  # Release reminder. A Dependabot *security* update to a runtime dependency (one that
  # ships in the published artifact) merges like any other update, and nothing is
  # released automatically. Until someone publishes a release, Maven Central still serves
  # the vulnerable version, so this job opens an issue assigned to the repository owner,
  # which GitHub emails to them. If that issue is still open when another such update
  # merges, the job adds a comment to it instead of opening a second one: one release
  # covers them all.
  #
  # These updates are recognised by the "runtime-security" Dependabot group (see
  # .github/dependabot.yml), whose branches are named
  # dependabot/gradle/runtime-security-<hash>. A security fix that reaches main on any
  # other branch gets no reminder.
  #
  # The job does not wait for the build: the reminder is wanted even when the build on
  # main fails.
  release-reminder:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.author.name == 'dependabot[bot]'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Detect runtime security update
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
          echo "Merged PR branch: ${pr_head:-<none>}"

          case "$pr_head" in
            dependabot/gradle/runtime-security-*)
              echo "Runtime security update; opening a release reminder."
              echo "remind=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Not a runtime security update; no reminder."
              echo "remind=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Ask for a release
        if: steps.detect.outputs.remind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          subject=${COMMIT_MSG%%$'\n'*}

          # The last release, for a link to everything a new release would publish. The
          # reminder is sent even when it cannot be found.
          if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null); then
            latest=""
          fi
          case "$latest" in
            v[0-9]*) since="Last release: \`$latest\`. Everything a new release would publish: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$latest...main" ;;
            *) since="The last release could not be looked up, so compare main with the latest release tag yourself." ;;
          esac

          first_body=$(cat <<BODY
          A Dependabot security update to a library this project ships was merged in \`$GITHUB_SHA\`:
          $subject

          The fix is on main, but Maven Central still serves the vulnerable version until a
          release is published. Nothing is released automatically.

          $since

          Choose the version number under the README's Versioning section: a patch release if
          nothing else in the library has changed since the last release. Then publish a GitHub
          release with a \`vX.Y.Z\` tag and close this issue.

          One release covers every fix listed here. A fix merged before then is added as a comment.
          BODY
          )
          later_body=$(cat <<BODY
          Another Dependabot security update to a shipped library was merged in \`$GITHUB_SHA\`:
          $subject

          No release has been published since this issue was opened. One release covers every
          fix listed here.

          $since
          BODY
          )

          gh label create release-needed --repo "$GITHUB_REPOSITORY" --force \
            --color D93F0B --description "A security fix is on main and needs a release by hand"

          # One open issue collects every fix that is waiting, because one release publishes
          # them all. A later fix becomes a comment on it, which GitHub also emails. If the
          # lookup fails, open a new issue: a duplicate is better than no reminder.
          open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-needed --state open \
            --json number --jq '.[0].number // empty') || open_issue=""
          case "$open_issue" in
            ''|*[!0-9]*)
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Security fix on main needs a release" \
                --label release-needed \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "$first_body"
              ;;
            *)
              gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" --body "$later_body"
              ;;
          esac

      # GitHub emails a failed run only to whoever started it, and a bot started this one.
      # Leave an issue instead, so a lost reminder is not missed.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          subject=${COMMIT_MSG%%$'\n'*}
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "An automated release workflow failed"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release reminder failed after: $subject" \
            --label release-failure \
            --body "$(cat <<BODY
          The CI \`release-reminder\` job failed on commit \`$GITHUB_SHA\`.

          Run: $RUN_URL

          Check whether that commit is a Dependabot security update to a shipped library
          (\`antlr4-runtime\` or \`slf4j-api\`). If it is, the fix needs a release.
          BODY
          )"
