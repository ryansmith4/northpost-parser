name: Release to Maven Central

on:
  release:
    types: [ published ]
  # Started by the CI auto-release job at a tag ref (github.ref_name is then the tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify ref is a release tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) echo "Releasing $GITHUB_REF_NAME" ;;
            *) echo "::error::Expected a vX.Y.Z tag ref, got '$GITHUB_REF_NAME'"; exit 1 ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  update-readme:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E \
            -e "s#(northpost-parser:)[0-9]+\.[0-9]+\.[0-9]+#\1${VERSION}#g" \
            -e "s#<version>[0-9]+\.[0-9]+\.[0-9]+</version>#<version>${VERSION}</version>#g" \
            README.md

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update README version to ${{ steps.version.outputs.version }}"
          title: "Update README version to ${{ steps.version.outputs.version }}"
          body: |
            Automated version update from release `${{ github.ref_name }}`.

            Updates dependency snippets in README.md to version `${{ steps.version.outputs.version }}`.
          branch: readme-version-update
          delete-branch: true

      # The PR above is created with GITHUB_TOKEN, so its push does not trigger the CI
      # workflow. Dispatch CI against the branch so the required status checks run,
      # then let auto-merge complete the PR once they pass.
      - name: Run CI and enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref readme-version-update
          gh pr merge --auto --squash "$PR_NUMBER"
